[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microclaw"
version = "0.1.0"
description = "Feature-rich lightweight personal AI assistant — your AI, your machine, your keys"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Manu Chauhan" },
]
keywords = ["ai", "assistant", "llm", "agent", "chatbot", "websocket"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.0",
    "aiosqlite>=0.20",
    "sqlite-vec>=0.1",
    "questionary>=2.0",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21.0"]
discord = ["discord.py>=2.3"]
slack = ["slack-bolt>=1.18"]
whatsapp = ["aiohttp>=3.9"]
browser = ["playwright>=1.40"]
pdf = ["pypdf>=4.0"]
embeddings = ["sentence-transformers>=3.0"]
all = [
    "python-telegram-bot>=21.0",
    "discord.py>=2.3",
    "slack-bolt>=1.18",
    "aiohttp>=3.9",
    "playwright>=1.40",
    "pypdf>=4.0",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
microclaw = "microclaw.cli:main"

[project.urls]
Homepage = "https://gitlab.com/MANU-CHAUHAN/microclaw"
Repository = "https://gitlab.com/MANU-CHAUHAN/microclaw"
Issues = "https://gitlab.com/MANU-CHAUHAN/microclaw/-/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/microclaw"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
