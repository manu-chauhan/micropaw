# MicroPaw with Docker Compose.
#
#   First time (asks for your provider and keys, saved in the data volume):
#     docker compose run --rm micropaw paw setup
#   Run in the background:
#     docker compose up -d
#   With a local model server (Ollama) next to it:
#     docker compose --profile ollama up -d
#     docker compose exec ollama ollama pull llama3.1
#     then set the Ollama host to http://ollama:11434 in the setup wizard
#   Chat in a terminal:
#     docker compose run --rm micropaw paw chat
#
# Keys: put them in a .env file next to this one (see .env.example); it is read at run time only.
# The container is the boundary for shell commands, so MicroPaw's own sandbox is not needed inside it.
# Nothing is published on the host except WebChat on 127.0.0.1, and only if you enable that channel.

services:
  micropaw:
    build: .
    image: micropaw:local
    env_file:
      - path: .env
        required: false   # Compose 2.24 or newer
    environment:
      MICROPAW_SANDBOX: "off"
    volumes:
      - micropaw-data:/home/paw/.micropaw
    ports:
      - "127.0.0.1:8765:8765"   # WebChat; unused unless that channel is enabled
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  ollama:
    profiles: [ollama]
    image: ollama/ollama
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # No ports: only the micropaw service reaches it, at http://ollama:11434.

volumes:
  micropaw-data:
  ollama-models:
