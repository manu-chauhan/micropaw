# MicroPaw — Docker Compose
#
# Usage:
#   micropaw chat    → docker compose run --rm micropaw chat
#   micropaw start   → docker compose up
#   with browser      → docker compose --profile browser up
#   all extras        → docker compose --profile full up

services:
  micropaw:
    build:
      context: .
      target: base
    env_file: .env
    volumes:
      - micropaw-data:/home/micropaw/.micropaw
    restart: unless-stopped
    stdin_open: true
    tty: true

  micropaw-browser:
    build:
      context: .
      target: browser
    env_file: .env
    volumes:
      - micropaw-data:/home/micropaw/.micropaw
    restart: unless-stopped
    profiles:
      - browser

  micropaw-full:
    build:
      context: .
      target: full
    env_file: .env
    volumes:
      - micropaw-data:/home/micropaw/.micropaw
    ports:
      - "8765:8765"   # WebChat WebSocket
      - "8080:8080"   # WhatsApp webhook
    restart: unless-stopped
    profiles:
      - full

volumes:
  micropaw-data:
