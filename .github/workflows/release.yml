name: Release

# Third-party actions are pinned to major version tags. Pin them by commit SHA before the first release.
# Runs only for tags like v0.4.0. A tag with a dash (v0.4.0-rc1) is a pre-release and does not get "latest".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel
        run: uv build
      - name: Checksums of the packages and install scripts
        run: sha256sum install.sh install.ps1 dist/* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/*
            SHA256SUMS
            install.sh
            install.ps1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
      - name: Create the release
        run: |
          {
            echo "SHA256 of the packages and install scripts (also attached as SHA256SUMS):"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          flag=""
          case "$TAG" in *-*) flag="--prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$TAG" dist/* SHA256SUMS install.sh install.ps1 \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --generate-notes $flag

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  pypi:
    # Off until trusted publishing is set up on PyPI for this repository.
    if: false
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
