name: CI

# Third-party actions are pinned to major version tags. Pin them by commit SHA before the first release.

on:
  push:
    branches: [main, "modernize-*"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Lint
        run: uv run --no-sync ruff check src tests
      - name: Test
        run: uv run --no-sync pytest -q

  canary:
    name: air-gap canary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Bubblewrap (Linux runs the child-process half of the canary too)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-all --ro-bind / / true
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Canary, guard and child-process tests
        run: uv run --no-sync pytest -q tests/test_privacy_canary.py tests/test_privacy_egress.py tests/test_privacy_spawn.py

  installers:
    name: install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck and sh -n
        run: |
          shellcheck -s sh install.sh
          sh -n install.sh
      - name: PowerShell parses
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors; exit 1 }

  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  image-arm:
    name: docker build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            extras: telegram,discord,slack,whatsapp,pdf
          # No linux/arm/v7 entry: the Dockerfile copies uv from its image, which has only amd64 and arm64 builds.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: EXTRAS=${{ matrix.extras }}
          tags: micropaw:arm-check
          load: true
          push: false
      # Build and import only. The test suite under QEMU would take far too long.
      - name: Import smoke test
        run: |
          docker run --rm --platform ${{ matrix.platform }} micropaw:arm-check paw --version
          docker run --rm --platform ${{ matrix.platform }} micropaw:arm-check python -c "import micropaw.cli, micropaw.memory.store, micropaw.gateway"
